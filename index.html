<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-title" content="Uplift" />
  <link rel="apple-touch-icon" href="assets/icon.png" />
  <title>Uplift</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.88.2/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game"></div>

  <script src="data/state.js"></script>
  <script src="data/levels.js"></script>
  <script src="data/upgrades.js"></script>
  <script src="data/sounds.js"></script>
  <script src="scenes/BootScene.js"></script>
  <script src="scenes/GameScene.js"></script>
  <script src="scenes/UpgradeScene.js"></script>
  <script src="scenes/SettingsScene.js"></script>
  <script src="scenes/GameOverScene.js"></script>
  <script src="scenes/WinScene.js"></script>
  <script src="main.js"></script>

  <script>
    // Register the service worker so the home-screen webapp pulls
    // fresh code on every launch (and still works offline).
    // iOS PWAs don't always re-check sw.js automatically, so we force
    // an update() on each load and reload the page when a new SW
    // takes control — that swaps in fresh code without a manual refresh.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js")
          .then((reg) => { reg.update(); })
          .catch(() => {});
        let reloading = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (reloading) return;
          reloading = true;
          window.location.reload();
        });
      });
    }
  </script>
</body>
</html>
